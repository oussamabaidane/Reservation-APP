stages:
  - test
  - quality
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  paths:
    - .m2/repository
    - frontend/node_modules/

backend_tests:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -B clean verify

frontend_build:
  stage: test
  image: node:24-alpine
  script:
    - cd frontend
    - npm install
    - npm run build

sonarqube_scan:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -B verify sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  allow_failure: true
  only:
    - main
    - develop

docker_build:
  stage: docker
  image: docker:29
  services:
    - docker:29-dind
  script:
    - docker compose build
  only:
    - main
    - develop

deploy_shared_server:
  stage: deploy
  image: alpine:3.22
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Configure SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER and DEPLOY_PATH to enable deployment."
    - echo "Deployment command example: ssh $DEPLOY_USER@$DEPLOY_HOST 'cd $DEPLOY_PATH && docker compose up -d --build'"
  when: manual
  only:
    - main
