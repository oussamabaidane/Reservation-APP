server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-auth
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: identity-employees
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/employees/**
            - id: rooms
              uri: ${ROOM_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/rooms/**
            - id: reservations
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/reservations/**
            - id: notifications
              uri: ${NOTIFICATION_AUDIT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/notifications/**
            - id: audit
              uri: ${NOTIFICATION_AUDIT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/audit/**
            - id: statistics
              uri: ${NOTIFICATION_AUDIT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/statistics

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
