services:
  api-gateway:
    build: ./api-gateway
    container_name: rr-api-gateway
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-employee-service:8081
      ROOM_SERVICE_URL: http://room-service:8082
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      NOTIFICATION_AUDIT_SERVICE_URL: http://notification-audit-service:8084
    depends_on:
      - identity-employee-service
      - room-service
      - reservation-service
      - notification-audit-service

  frontend:
    build: ./frontend
    container_name: rr-frontend
    ports:
      - "8085:80"
    depends_on:
      - api-gateway

  identity-employee-service:
    build: ./identity-employee-service
    container_name: rr-identity-employee-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/identity_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
    depends_on:
      - identity-db

  room-service:
    build: ./room-service
    container_name: rr-room-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://room-db:5432/room_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
    depends_on:
      - room-db

  reservation-service:
    build: ./reservation-service
    container_name: rr-reservation-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://reservation-db:5432/reservation_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      NOTIFICATION_AUDIT_SERVICE_URL: http://notification-audit-service:8084
    depends_on:
      - reservation-db
      - redis

  notification-audit-service:
    build: ./notification-audit-service
    container_name: rr-notification-audit-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
    depends_on:
      - notification-db

  identity-db:
    image: postgres:16-alpine
    container_name: rr-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5433:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data

  room-db:
    image: postgres:16-alpine
    container_name: rr-room-db
    environment:
      POSTGRES_DB: room_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5434:5432"
    volumes:
      - room_db_data:/var/lib/postgresql/data

  reservation-db:
    image: postgres:16-alpine
    container_name: rr-reservation-db
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5435:5432"
    volumes:
      - reservation_db_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: rr-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5436:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: rr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: rr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.1.0
    container_name: rr-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./devops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: rr-jenkins
    user: root
    ports:
      - "8086:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  sonarqube:
    image: sonarqube:community
    container_name: rr-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db

  sonar-db:
    image: postgres:16-alpine
    container_name: rr-sonar-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    ports:
      - "5437:5432"
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  identity_db_data:
  room_db_data:
  reservation_db_data:
  notification_db_data:
  redis_data:
  prometheus_data:
  grafana_data:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
