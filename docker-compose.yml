services:
  api-gateway:
    build: ./api-gateway
    container_name: rr-api-gateway
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-employee-service:8081
      ROOM_SERVICE_URL: http://room-service:8082
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      NOTIFICATION_AUDIT_SERVICE_URL: http://notification-audit-service:8084
    depends_on:
      - identity-employee-service
      - room-service
      - reservation-service
      - notification-audit-service

  frontend:
    build: ./frontend
    container_name: rr-frontend
    ports:
      - "8085:80"
    depends_on:
      - api-gateway

  identity-employee-service:
    build: ./identity-employee-service
    container_name: rr-identity-employee-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/identity_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
    depends_on:
      - identity-db

  room-service:
    build: ./room-service
    container_name: rr-room-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://room-db:5432/room_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
    depends_on:
      - room-db

  reservation-service:
    build: ./reservation-service
    container_name: rr-reservation-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://reservation-db:5432/reservation_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      NOTIFICATION_AUDIT_SERVICE_URL: http://notification-audit-service:8084
    depends_on:
      - reservation-db
      - redis

  notification-audit-service:
    build: ./notification-audit-service
    container_name: rr-notification-audit-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
    depends_on:
      - notification-db

  identity-db:
    image: postgres:16-alpine
    container_name: rr-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5433:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data

  room-db:
    image: postgres:16-alpine
    container_name: rr-room-db
    environment:
      POSTGRES_DB: room_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5434:5432"
    volumes:
      - room_db_data:/var/lib/postgresql/data

  reservation-db:
    image: postgres:16-alpine
    container_name: rr-reservation-db
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5435:5432"
    volumes:
      - reservation_db_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: rr-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5436:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: rr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  identity_db_data:
  room_db_data:
  reservation_db_data:
  notification_db_data:
  redis_data:
