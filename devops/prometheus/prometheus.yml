global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: spring-boot-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
        labels:
          service: api-gateway
      - targets:
          - identity-employee-service:8081
        labels:
          service: identity-employee-service
      - targets:
          - room-service:8082
        labels:
          service: room-service
      - targets:
          - reservation-service:8083
        labels:
          service: reservation-service
      - targets:
          - notification-audit-service:8084
        labels:
          service: notification-audit-service

  - job_name: spring-boot-host-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: api-gateway
      - targets:
          - host.docker.internal:8081
        labels:
          service: identity-employee-service
      - targets:
          - host.docker.internal:8082
        labels:
          service: room-service
      - targets:
          - host.docker.internal:8083
        labels:
          service: reservation-service
      - targets:
          - host.docker.internal:8084
        labels:
          service: notification-audit-service
